name: Release plugin zips

# Publishes the bundled / Pro / Expert plugin zips as GitHub Release assets.
# Trigger by pushing a version tag (e.g. `git tag v1.7.0 && git push origin v1.7.0`),
# or run manually from the Actions tab with a tag name.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v1.7.0)'
        required: true

permissions:
  contents: write          # required to create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none

      - name: Build edition zips
        run: ./build-plugin-zips.sh

      - name: Verify build output
        run: |
          ls -lh dist/*.zip
          test "$(ls dist/*.zip | wc -l)" -eq 3

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          {
            echo "Installable WordPress builds of SEO Sprinkler."
            echo
            echo "- **seo-sprinkler-<ver>.zip** — bundled / metered. Runs Free and unlocks Pro/Expert when a licence key is entered. Recommended for the storefront & wordpress.org."
            echo "- **seo-sprinkler-pro-<ver>.zip** — Pro, pre-activated (no key needed)."
            echo "- **seo-sprinkler-expert-<ver>.zip** — Expert, pre-activated (no key needed)."
            echo
            echo "Install via Plugins → Add New → Upload Plugin."
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "SEO Sprinkler $TAG" --notes-file release-notes.md
          fi
