{% extends "base.html" %}
{% block title %}Admin sign in · {{ BRAND }}{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:50px auto">
  <h2 style="margin-top:0">Admin sign in</h2>
  <form method="post" action="{{ url_for('admin.login') }}">
    <label>Username</label>
    <input type="text" name="username" autofocus required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button class="btn btn--block" type="submit" style="margin-top:18px">Sign in</button>
  </form>
  <p class="muted" style="font-size:13px;margin-top:12px">Default seed: <code>admin</code> / <code>changeme</code> — change via <code>ADMIN_USER</code> / <code>ADMIN_PASS</code>.</p>
</div>
{% endblock %}
